name: Flutter Build (Debug APK)

# Trigger: any push that touches the Flutter app, or manual dispatch.
# This means GLM (or you) writes Dart code → push to GitHub → CI builds
# a debug APK automatically → you download it from the Actions tab for testing.
# No local Flutter install required.
on:
  push:
    paths:
      - "flutter_app/**"
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android/iOS platform scaffolding
        # The repo ships lib/ + pubspec.yaml only (no android/ ios/ Gradle scaffold,
        # since it was authored in an AI sandbox without Flutter). Generate it in-place
        # on the runner; existing lib/*.dart and pubspec.yaml are preserved.
        run: flutter create --project-name tradeseekho --platforms android,ios --no-pub .

      - name: Bump Kotlin to 1.9.24 (play-services-ads 23.4 needs Kotlin 1.9+)
        # google_mobile_ads -> play-services-ads 23.4.0 is compiled with Kotlin 1.9
        # metadata, but the Flutter 3.22 template pins Kotlin 1.7.1 -> compileDebugKotlin fails.
        run: |
          # Kotlin DSL (Flutter 3.16+ default): id("org.jetbrains.kotlin.android") version "1.7.x"
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's#(kotlin\.android"\) version ")[0-9.]+#\11.9.24#' android/settings.gradle.kts
            echo "patched settings.gradle.kts:"; grep -n "kotlin" android/settings.gradle.kts || true
          fi
          # Groovy fallback: id "org.jetbrains.kotlin.android" version "1.7.x"
          if [ -f android/settings.gradle ]; then
            sed -i -E 's#(kotlin\.android" version ")[0-9.]+#\11.9.24#' android/settings.gradle
            echo "patched settings.gradle:"; grep -n "kotlin" android/settings.gradle || true
          fi

      - name: Inject AdMob APPLICATION_ID into AndroidManifest
        # google_mobile_ads REQUIRES com.google.android.gms.ads.APPLICATION_ID meta-data in
        # AndroidManifest.xml, otherwise MobileAds.initialize() CRASHES the app on launch.
        # `flutter create` does NOT add it. We inject Google's official test App ID here.
        # (Replace with your real AdMob App ID via repo variable ADMOB_APP_ID when ready.)
        run: |
          python3 - <<'PY'
          import os, re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          app_id = os.environ.get("ADMOB_APP_ID", "ca-app-pub-3940256099942544~3347511713")  # Google's test App ID
          meta = f'        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}" />\n'
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", meta + "    </application>")
              open(p, "w").write(s)
              print(f"injected AdMob APPLICATION_ID = {app_id}")
          else:
              print("AdMob APPLICATION_ID already present")
          # allow cleartext http (dev API on 10.0.2.2) so http calls don't get blocked
          if "android:usesCleartextTraffic" not in s:
              s2 = open(p).read()
              s2 = re.sub(r'(<application\b)', '<application android:usesCleartextTraffic="true"', s2, count=1)
              open(p, "w").write(s2)
              print("enabled usesCleartextTraffic")
          PY
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build debug APK
        # Default API_BASE_URL (10.0.2.2:3000) targets the Android EMULATOR reaching
        # the host's Next.js API. For REAL-device builds, set a GitHub repo variable
        # named API_BASE_URL = https://your-vercel-app.vercel.app — this dart-define
        # injects it. (Repo → Settings → Secrets and variables → Actions → Variables.)
        run: flutter build apk --debug --no-tree-shake-icons ${{ vars.API_BASE_URL && format('--dart-define=API_BASE_URL={0}', vars.API_BASE_URL) || '' }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tradeseekho-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  build-web-snapshot:
    # Also build a Flutter Web snapshot (optional) — quick visual smoke test.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
      - name: Generate web scaffolding
        run: flutter create --project-name tradeseekho --platforms web --no-pub .
      - run: flutter pub get
      - run: flutter build web --web-renderer canvaskit || true
      - uses: actions/upload-artifact@v4
        with:
          name: tradeseekho-web-snapshot
          path: flutter_app/build/web
          retention-days: 7
